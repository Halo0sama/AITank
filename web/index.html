<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 坦克动荡 · 网页版</title>
<style>
  :root{--bg:#0d0e14;--pan:#141624;--line:rgba(120,130,220,.22);--txt:#dde0ee;--dim:#8890b0;--acc:#6e78dc}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;min-height:100vh;user-select:none}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  h1{font-size:24px;font-weight:900}
  .sub{font-size:12px;color:var(--dim)}
  #stage{position:relative;width:min(660px,95vw)}
  canvas{width:100%;display:block;border-radius:22px;background:#0f1120;touch-action:none}
  #chips{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}
  .chip{flex:1;background:rgba(90,100,200,.12);border:1px solid var(--line);border-radius:16px;padding:6px 14px;backdrop-filter:blur(6px)}
  .chip .lb{font-size:10px;color:var(--dim)}
  .chip .sc{font-size:22px;font-weight:900}
  .chip.hit{border-color:rgba(255,100,80,.4)}
  .chip.hit .sc{color:#ff6a5a}
  #brain{position:absolute;bottom:8px;right:14px;left:14px;font-size:11px;color:var(--dim);text-align:right;pointer-events:none}
  #status{font-size:12px;color:var(--dim);text-align:center;min-height:18px;margin-top:6px}
  #status.err{color:#ff6a5a}
  #ctrl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:4px}
  #dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px);gap:5px}
  .dp{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;touch-action:none}
  .dp.on{background:rgba(110,120,220,.32);border-color:rgba(110,120,220,.55)}
  #fireBtn{width:78px;height:78px;border-radius:50%;background:#33406e;color:#cdd6f4;font-size:15px;font-weight:800;border:none;cursor:pointer}
  #fireBtn:active{background:#46528a;transform:scale(.93)}
  #pauseBtn,#cfgBtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--txt);padding:7px 14px;font-size:13px;cursor:pointer;margin-top:8px}
  #dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;align-items:center;justify-content:center}
  .box{background:#171a2a;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px;width:min(430px,92vw)}
  .box h3{font-size:16px;margin-bottom:6px}
  .box label{font-size:12px;color:var(--dim);display:block;margin:10px 0 4px}
  .box input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--txt);padding:8px 12px;font-size:13px}
  #memBox{font-size:11px;color:#67709a;max-height:86px;overflow-y:auto;margin-top:4px;line-height:1.5}
  .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .btns button{padding:7px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px}
  .btns .save{background:#33406e;border-color:#46528a}
</style>
</head>
<body>
<header><h1>AI 坦克动荡</h1><span class="sub">经典坦克动荡 · 对手大脑 = DeepSeek（网页版）</span></header>

<div id="stage">
  <div id="chips">
    <div class="chip" id="chipP"><div class="lb">玩家</div><div class="sc" id="sp">0</div></div>
    <div class="chip" id="chipA"><div class="lb">AI</div><div class="sc" id="sa">0</div></div>
    <div class="chip"><div class="lb">回合</div><div class="sc" id="sr">1</div></div>
  </div>
  <canvas id="cv" width="700" height="820"></canvas>
  <div id="brain">对手大脑待机…</div>
</div>

<div id="status">W 前进 · S 后退 · A/D 旋转 · 空格/J 开炮 · P 暂停</div>

<div id="ctrl">
  <div id="dpad">
    <div></div><div class="dp" data-k="fwd">▲</div><div></div>
    <div class="dp" data-k="ccw">◀</div><div></div><div class="dp" data-k="cw">▶</div>
    <div></div><div class="dp" data-k="back">▼</div><div></div>
  </div>
  <div style="width:30px"></div>
  <button id="fireBtn">🔥</button>
</div>
<div style="display:flex;gap:10px">
  <button id="pauseBtn">⏸ 暂停</button>
  <button id="cfgBtn">⚙ AI 设置</button>
  <button id="dodgeOnlyBtn">🛡 仅躲避测试</button>
  <button id="testBtn" style="display:none">🧪 测试模式</button>
</div>

<div id="dlg">
  <div class="box">
    <h3>AI 设置（DeepSeek · Anthropic 格式）</h3>
    <label>API Key（留空使用内置）</label><input id="cfgKey" placeholder="sk-...">
    <label>模型名</label><input id="cfgModel">
    <label>接口地址</label><input id="cfgEndpoint">
    <label>持久记忆（每局复盘自动积累）</label>
    <div id="memBox"></div>
    <div class="btns">
      <button id="memClr" style="color:#f66">清记忆</button>
      <button id="save" class="save">保存</button>
      <button onclick="document.getElementById('dlg').style.display='none'">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==================== 常量 ==================== */
const COLS=7, ROWS=8, CELL=100, WT=14;
const FW=COLS*CELL, FH=ROWS*CELL;               // 700 x 800
const TR=26, BR=6, TSPD=85, BSPD=128;
const MAG=5, FIRECD=0.4, BLIFE=15;
const ROT=180*Math.PI/180;                      // 原版：3°/帧@60fps = 180°/s，玩家与 AI 同速

/* ==================== 状态 ==================== */
let vWalls,hWalls,walls=[];
let bullets=[],parts=[];
let round=1,interT=0,reviewPending=false,gT=0,paused=false,lastSnap=0;
let lastRoundLog="";
const roundLog=[];
let P={x:150,y:150,a:0,alive:true,score:0,live:0,cd:0};
let E={x:550,y:650,a:Math.PI,alive:true,score:0,live:0,cd:0,curAlgo:null,act:null,turnTarget:null};
let lessons=[];
let cfg={key:"",model:"deepseek-flash",endpoint:"https://api.deepseek.com/anthropic/v1/messages"};

/* ==================== 迷宫 ==================== */
function genMaze(){
  vWalls=Array.from({length:COLS+1},()=>Array(ROWS).fill(false));
  hWalls=Array.from({length:COLS},()=>Array(ROWS+1).fill(false));
  for(let r=0;r<ROWS;r++){vWalls[0][r]=vWalls[COLS][r]=true}
  for(let c=0;c<COLS;c++){hWalls[c][0]=hWalls[c][ROWS]=true}
  const D=0.32;
  for(let c=1;c<COLS;c++)for(let r=0;r<ROWS;r++)if(Math.random()<D)vWalls[c][r]=true;
  for(let c=0;c<COLS;c++)for(let r=1;r<ROWS;r++)if(Math.random()<D)hWalls[c][r]=true;
  let g=0;
  while(regions()>1&&g++<400){
    if(Math.random()<.5){const c=1+(Math.random()*(COLS-1)|0),r=Math.random()*ROWS|0;vWalls[c][r]=false}
    else{const c=Math.random()*COLS|0,r=1+(Math.random()*(ROWS-1)|0);hWalls[c][r]=false}
  }
  walls=[];
  for(let c=0;c<=COLS;c++)for(let r=0;r<ROWS;r++)if(vWalls[c][r])walls.push({x:c*CELL-WT/2,y:r*CELL-WT/2,w:WT,h:CELL+WT});
  for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS;r++)if(hWalls[c][r])walls.push({x:c*CELL-WT/2,y:r*CELL-WT/2,w:CELL+WT,h:WT});
}
function regions(){
  const seen=Array.from({length:COLS},()=>Array(ROWS).fill(false));
  let n=0;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    if(seen[c][r])continue;
    n++;const st=[[c,r]];seen[c][r]=true;
    while(st.length){
      const[x,y]=st.pop();
      if(x>0&&!vWalls[x][y]&&!seen[x-1][y]){seen[x-1][y]=true;st.push([x-1,y])}
      if(x<COLS-1&&!vWalls[x+1][y]&&!seen[x+1][y]){seen[x+1][y]=true;st.push([x+1,y])}
      if(y>0&&!hWalls[x][y]&&!seen[x][y-1]){seen[x][y-1]=true;st.push([x,y-1])}
      if(y<ROWS-1&&!hWalls[x][y+1]&&!seen[x][y+1]){seen[x][y+1]=true;st.push([x,y+1])}
    }
  }
  return n;
}
function blk(x,y,r=TR){
  if(x<r||y<r||x>FW-r||y>FH-r)return true;
  for(const w of walls)if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return true;
  return false;
}
function bblk(x,y){
  if(x<BR||y<BR||x>FW-BR||y>FH-BR)return true;
  for(const w of walls)if(x+BR>w.x&&x-BR<w.x+w.w&&y+BR>w.y&&y-BR<w.y+w.h)return true;
  return false;
}
function newRound(){
  genMaze();
  bullets=[];parts=[];
  P.live=E.live=0;P.cd=E.cd=0;
  let ax=(0.5+Math.random()*(COLS-1))*CELL,ay=(0.5+Math.random()*(ROWS-1))*CELL;
  let ex=FW-ax,ey=FH-ay,t=0;
  while((blk(ax,ay)||blk(ex,ey))&&t++<40){ax=(0.5+Math.random()*(COLS-1))*CELL;ay=(0.5+Math.random()*(ROWS-1))*CELL;ex=FW-ax;ey=FH-ay}
  P.x=ax;P.y=ay;E.x=ex;E.y=ey
  P.a=Math.random()*2*Math.PI;E.a=Math.random()*2*Math.PI;
  P.alive=E.alive=true;
  roundLog.length=0;
}

/* ==================== 射击/回合 ==================== */
function releaseAmmo(b){if(b.own==="P"){P.live=Math.max(0,P.live-1)}else{E.live=Math.max(0,E.live-1)}}
function fire(t){
  if(!t.alive||t.cd>0||t.live>=MAG)return false;
  t.cd=FIRECD;t.live++;
  bullets.push({x:t.x+Math.cos(t.a)*(TR+BR+2),y:t.y+Math.sin(t.a)*(TR+BR+2),vx:Math.cos(t.a)*BSPD,vy:Math.sin(t.a)*BSPD,own:t===P?"P":"E",life:BLIFE});
  if(!testMode){
    const sol=aimRicochet(t,t===P?E:P);
    const hitChance=sol&&Math.abs(angDiff(sol.angle,t.a))<0.1;
    roundLog.push(`[${gT.toFixed(1)}] ${t===P?"玩家":"AI"} 开炮 ${(t.a*180/Math.PI).toFixed(0)}° ${hitChance?"（弹道计算：此角可命中！）":""}`);
  }
  return true;
}
function boom(x,y){
  for(let i=0;i<14;i++){
    const a=Math.random()*2*Math.PI,s=40+Math.random()*160;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4});
  }
}
function updateBulletsStandalone(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;
    if(b.life<=0){boom(b.x,b.y);bullets.splice(i,1);releaseAmmo(b);continue}
    const sub=3,sdt=dt/sub;
    for(let s2=0;s2<sub;s2++){
      const nx=b.x+b.vx*sdt;
      if(bblk(nx,b.y))b.vx=-b.vx;else b.x=nx;
      const ny=b.y+b.vy*sdt;
      if(bblk(b.x,ny))b.vy=-b.vy;else b.y=ny;
    }
  }
}

function roundOver(loser){
  if(testMode)return; // 测试模式：不结算不复盘
  const w=loser===P?E:P;
  w.score++;
  roundLog.push(`[${gT.toFixed(1)}] ${w===P?"玩家":"AI"} 击毁 ${loser===P?"玩家":"AI"}（击杀距离${Math.hypot(w.x-loser.x,w.y-loser.y)/CELL|0}格,角度差${(angDiff(Math.atan2(loser.y-w.y,loser.x-w.x),w.a)*180/Math.PI).toFixed(0)}°）`);
  lastRoundLog=roundLog.join("\n")+`\n[终局] 比分 玩家${P.score}:${E.score}AI`;
  interT=2.2;reviewPending=true;
  hud();
  if(!E.busy){E.busy=true;doReflect().finally(()=>{E.busy=false})}
}

/* ==================== 反射层（AI 本地毫秒级） ==================== */
function dodgeDir(t){
  for(const b of bullets){
    let bx=b.x,by=b.y,vx=b.vx,vy=b.vy,threat=false;
    for(let i=0;i<70;i++){
      const nx=bx+vx/60,ny=by+vy/60;
      if(bblk(nx,by))vx=-vx;else bx=nx;
      if(bblk(bx,ny))vy=-vy;else by=ny;
      if(Math.hypot(t.x-bx,t.y-by)<TR+BR+14){threat=true;break}
    }
    if(!threat)continue;
    if(Math.abs(vx)>=Math.abs(vy))return blk(t.x,t.y-40,TR)?(blk(t.x,t.y+40,TR)?null:"down"):(blk(t.x,t.y+40,TR)?"up":"up");
    return blk(t.x-40,t.y,TR)?(blk(t.x+40,t.y,TR)?null:"right"):(blk(t.x+40,t.y,TR)?"left":"left");
  }
  return null;
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.max(1,d/20|0);
  for(let i=1;i<n;i++){const t=i/n;if(blk(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}
  return true;
}
function stepTank(t,dt){
  const nx=t.x+Math.cos(t.a)*TSPD*dt,ny=t.y+Math.sin(t.a)*TSPD*dt;
  if(!blk(nx,t.y))t.x=nx;
  if(!blk(t.x,ny))t.y=ny;
}
function dodgeDirOf(t,ctx){for(const b of ctx.bullets){if(Math.hypot(b.x-t.x,b.y-t.y)<160)return true}return false}
function aiLocal(dt){
  if(!E.alive)return;
  const ctx={enemy:P,bullets,walls,blk,bblk,los};
  if(dodgeOnly){
    if(dodgeDirOf(E,ctx))ALGOS.dodge_bullets.fn(E,dt,ctx);
    return;
  }
  // 1) 算法在跑：交给算法（新指令已在 applyCmd 中清掉 curAlgo 实现打断）
  if(E.curAlgo&&ALGOS[E.curAlgo]&&typeof ALGOS[E.curAlgo].fn==="function"){
    ALGOS[E.curAlgo].fn(E,dt,ctx);
    // 算法运行时也保持基础威胁感（算法返回 false 表示无威胁/不适用）
  }
  // 2) 直接动作（fwd/back 限时驱动）
  if(E.act&&E.act.type==="drive"){
    if(gT<E.act.until)drive(E,dt,E.act.dir);
    else E.act=null;
  }
  // 3) 无算法无动作且无转向意图：默认巡航（转向也走意图，保证限速）
  if(!E.curAlgo&&!E.act&&E.turnTarget==null){
    if(Math.random()<.06)E.turnTarget=E.a+(Math.random()-.5)*.6;
    drive(E,dt,1);
    if(blk(E.x+Math.cos(E.a)*70,E.y+Math.sin(E.a)*70))E.turnTarget=E.a+Math.PI/2;
  }
  // 4) 转向意图统一消化（每帧仅此一处改 E.a，限速 180°/s = 与玩家同速）
  if(E.turnTarget!=null){
    const d=angDiff(E.turnTarget,E.a);
    if(Math.abs(d)<0.02){E.a=E.turnTarget;E.turnTarget=null}
    else E.a+=Math.sign(d)*Math.min(Math.abs(d),ROT*dt);
  }
}

/* ==================== 算法库（内置 = AI 可自写算法的同层级注册表） ====================
 * 每个算法 = 每帧调用的操控函数(t=坦克, dt=帧时长, ctx={敌人,子弹,迷宫查询})
 * AI 可在复盘时输出 {"new_algo":{"name":"...","desc":"..."}} 声明新算法（存档），
 * 之后用 {"cmd":"algo","name":"..."} 调用——与内置算法完全同层级。
 */
const ALGOS = {};
function reg(name, desc, fn){ ALGOS[name] = { desc, fn, builtin: true } }

/* --- 安全类 --- */
// 规避子弹：预测所有子弹未来弹道（含反弹），威胁逼近时垂直于弹道逃逸
reg("dodge_bullets", "预测弹道并垂直逃逸（安全）", (t, dt, ctx) => {
  let worst = null; // {b, dist, eta}
  for (const b of ctx.bullets) {
    let bx=b.x, by=b.y, vx=b.vx, vy=b.vy, eta=0;
    for (let i=0;i<240;i++){ // 4s 弹道模拟（子弹速 105px/s，威胁可能 2s 后才到）
      const nx=bx+vx*(1/60), ny=by+vy*(1/60);
      if(ctx.bblk(nx,by))vx=-vx;else bx=nx;
      if(ctx.bblk(bx,ny))vy=-vy;else by=ny;
      eta=i/60;
      const d=Math.hypot(t.x-bx,t.y-by);
      if(d<70&&(!worst||eta<worst.eta)){worst={vx,vy,eta,d};break}
    }
  }
  if(!worst)return false; // 无威胁
  // 垂直于子弹方向逃逸（选更空的一侧；两侧都紧时选留白较多者）
  const perp1=Math.atan2(-worst.vx,worst.vy), perp2=perp1+Math.PI;
  const room1=freeRoom(t,perp1,ctx), room2=freeRoom(t,perp2,ctx);
  if(room1<=0&&room2<=0)return false; // 完全无路可逃
  const ta=room1>=room2?perp1:perp2;
  turnToward(t,ta,dt);
  drive(t,dt,1);
  if(room1<TR+10||room2<TR+10){ // 空间紧张：同时尝试斜向撤离
    turnToward(t,ta+Math.sign(room1-room2)*0.6,dt);
  }
  return true;
});
// 保持距离：距敌 < 2.5 格则背离撤离
reg("keep_distance", "与对手保持 2.5 格以上距离", (t, dt, ctx) => {
  const e=ctx.enemy; const d=Math.hypot(e.x-t.x,e.y-t.y);
  if(d>250)return false;
  turnToward(t,Math.atan2(t.y-e.y,t.x-e.x),dt);
  drive(t,dt,1);
  return true;
});

/* --- 进攻类 --- */
// 追击：转向敌人并推进；对齐（±10°）且视线无墙时开火
reg("chase_and_fire", "追击敌人，对齐即开火", (t, dt, ctx) => {
  const e=ctx.enemy;
  const ta=Math.atan2(e.y-t.y,e.x-t.x);
  turnToward(t,ta,dt);
  const aligned=Math.abs(angDiff(ta,t.a))<0.17;
  if(aligned&&ctx.los(t.x,t.y,e.x,e.y))fire(t);
  if(Math.hypot(e.x-t.x,e.y-t.y)>120)drive(t,dt,1);
  return true;
});
// 反弹狙击：全角度弹道搜索（含墙体反弹），找到能命中敌人的开火角才转炮开火
reg("ricochet_fire", "反弹弹道计算，命中角存在才开火", (t, dt, ctx) => {
  const sol = aimRicochet(t, ctx.enemy);
  if (!sol) return false; // 当前位形无解（罕见）
  turnToward(t, sol.angle, dt);
  const aligned = Math.abs(angDiff(sol.angle, t.a)) < 0.06;
  if (aligned && t.cd <= 0 && t.live < MAG) {
    fire(t);
    return true;
  }
  return true; // 转向中也算处理中
});

// 侧翼包抄：绕到敌人侧向 90° 位置再开火
reg("flank", "绕行敌侧翼制造射角", (t, dt, ctx) => {
  const e=ctx.enemy;
  const d=Math.atan2(e.y-t.y,e.x-t.x);
  const orbit=d+(t.flankDir||((t.flankDir=Math.random()<.5?1:-1)));
  turnToward(t,orbit,dt);
  drive(t,dt,1);
  if(Math.abs(angDiff(d,t.a))<0.17&&ctx.los(t.x,t.y,e.x,e.y))fire(t);
  return true;
});

/* --- 机动类 --- */
// 巡航：随机游走避墙
reg("roam", "随机巡航（默认）", (t, dt, ctx) => {
  if(t.turnTarget==null&&Math.random()<.06)t.turnTarget=t.a+(Math.random()-.5)*.6;
  if(ctx.blk(t.x+Math.cos(t.a)*70,t.y+Math.sin(t.a)*70))t.turnTarget=t.a+Math.PI/2*(Math.random()<.5?1:-1);
  drive(t,dt,1);
  return true;
});

function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function condMatch(when,t,ctx){
  if(when==="always")return true;
  if(when==="bullet_threat"){
    const dg=ALGOS.dodge_bullets;
    return threatNear(t,ctx)||(dg&&typeof dg.fn==="function"&&!!dg.fn(t,0,ctx));
  }
  const m1=when.match(/^enemy_near:(\d+)$/);if(m1)return Math.hypot(ctx.enemy.x-t.x,ctx.enemy.y-t.y)<+m1[1];
  const m2=when.match(/^enemy_far:(\d+)$/);if(m2)return Math.hypot(ctx.enemy.x-t.x,ctx.enemy.y-t.y)>=+m2[1];
  if(when==="aligned"){const ta=Math.atan2(ctx.enemy.y-t.y,ctx.enemy.x-t.x);return Math.abs(angDiff(ta,t.a))<0.17}
  const m3=when.match(/^random:(\d+)$/);if(m3)return Math.random()<+m3[1];
  return true;
}
function threatNear(t,ctx){
  for(const b of ctx.bullets){
    const d=Math.hypot(b.x-t.x,b.y-t.y);
    if(d<120)return true;
  }
  return false;
}
function execPrim(doStr,t,dt,ctx){
  if(doStr==="fire_ricochet"){ // 反弹弹道计算后开火（aimRicochet 已含墙体反弹）
    const sol=aimRicochet(t,ctx.enemy);
    if(sol){turnToward(t,sol.angle,dt);if(Math.abs(angDiff(sol.angle,t.a))<0.06)fire(t)}
    return;
  }
  if(doStr==="fwd"){drive(t,dt,1);return}
  if(doStr==="back"){drive(t,dt,-1);return}
  if(doStr==="fire"){fire(t);return}
  if(doStr==="stop"){t.act=null;return}
  const mT=doStr.match(/^turn:(-?\d+(?:\.\d+)?)$/);if(mT){t.turnTarget=(t.a+ +mT[1]*Math.PI/180);return}
  const mF=doStr.match(/^face:(-?\d+(?:\.\d+)?)$/);if(mF){t.turnTarget=+mF[1]*Math.PI/180;return}
  // 其他算法名 = 委托
  const tgt=ALGOS[doStr];
  if(tgt&&typeof tgt.fn==="function")tgt.fn(t,dt,ctx);
}

/* ---- 公开弹道预测 API（算法可用） ----
 * predictPath(x,y,vx,vy,steps) → 反弹弹道点序列（含墙体反弹，逐步模拟）
 * willHit(fromTank, toTank, fireAngle) → 沿开火角模拟反弹弹道，返回 {hit, eta, path}
 * aimRicochet(fromTank, toTank) → 搜索所有可行开火角（含反弹），返回最佳角或 null
 */
function predictPath(x,y,vx,vy,steps=300){
  const pts=[{x,y}];let bx=x,by=y;
  for(let i=0;i<steps;i++){
    const nx=bx+vx*(1/60),ny=by+vy*(1/60);
    if(bblk(nx,by))vx=-vx;else bx=nx;
    if(bblk(bx,ny))vy=-vy;else by=ny;
    pts.push({x:bx,y:by});
  }
  return pts;
}
function willHit(fromT,toT,fireAngle){
  let vx=Math.cos(fireAngle)*BSPD,vy=Math.sin(fireAngle)*BSPD;
  let bx=fromT.x+Math.cos(fireAngle)*(TR+BR+2),by=fromT.y+Math.sin(fireAngle)*(TR+BR+2);
  for(let i=0;i<360;i++){
    const nx=bx+vx*(1/60),ny=by+vy*(1/60);
    if(bblk(nx,by))vx=-vx;else bx=nx;
    if(bblk(bx,ny))vy=-vy;else by=ny;
    const d=Math.hypot(toT.x-bx,toT.y-by);
    if(d<TR)return{hit:true,eta:i/60};
    if(Math.hypot(fromT.x-bx,fromT.y-by)>FW+FH)break;
  }
  return{hit:false};
}
function aimRicochet(fromT,toT){
  // 全角度扫描（2° 步进），命中且 ETA 最短者胜
  let best=null;
  for(let deg=0;deg<360;deg+=2){
    const a=deg*Math.PI/180;
    const r=willHit(fromT,toT,a);
    if(r.hit&&(!best||r.eta<best.eta))best={angle:a,eta:r.eta};
  }
  return best;
}
function freeRoom(t,ang,ctx){
  let n=0;
  while(n<12){
    const x=t.x+Math.cos(ang)*((n+1)*16), y=t.y+Math.sin(ang)*((n+1)*16);
    if(ctx.bblk(x,y))break; // 点级探测：躲闪通道只需弹径净空
    n++;
  }
  return n*16;
}
function turnToward(t,ta,dt){
  // 统一意图制：只更新目标角，实际转动由 aiLocal 单通道限速消化（180°/s）
  t.turnTarget=ta;
}
function drive(t,dt,dir){ // dir: 1 前 -0.65 后
  const d=dir>=0?1:-0.65;
  const nx=t.x+Math.cos(t.a)*TSPD*d*dt, ny=t.y+Math.sin(t.a)*TSPD*d*dt;
  if(!blk(nx,t.y))t.x=nx;
  if(!blk(t.x,ny))t.y=ny;
}

async function callAI(sys,user){

}
function pickJson(s){
  const i=s.indexOf("{"),j=s.lastIndexOf("}");
  return i>=0&&j>i?JSON.parse(s.slice(i,j+1)):null;
}
function stateText(){
  const c=(x,y)=>`(${x/CELL|0},${y/CELL|0})`;
  let s=`迷宫${COLS}x${ROWS}。你(E)=${c(E.x,E.y)} 朝${(E.a*180/Math.PI).toFixed(0)}° 弹匣余${MAG-E.live}\n`;
  s+=`对手(A)=${c(P.x,P.y)} 朝${(P.a*180/Math.PI).toFixed(0)}°\n`;
  s+=bullets.length?`子弹：${bullets.map(b=>`${c(b.x,b.y)}(${b.vx>0?"右":b.vx<0?"左":"0"},${b.vy>0?"下":b.vy<0?"上":"0"})`).join(" ")}\n`:"场上无子弹\n";
  s+=E.stuck?"警告：你被墙挡住，换方向！\n":"";
  s+=`比分 你${E.score}:${P.score}对手 回合${round}`;

}
function asciiMap(){
  const g=Array.from({length:2*ROWS+1},()=>Array(2*COLS+1).fill(" "));
  for(let c=0;c<=COLS;c++)for(let r=0;r<ROWS;r++)if(vWalls[c][r])g[2*r+1][2*c]="#";
  for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS;r++)if(hWalls[c][r])g[2*r][2*c]="#";
  const put=(x,y,ch)=>{const c=Math.min(COLS-1,Math.max(0,x/CELL|0)),r=Math.min(ROWS-1,Math.max(0,y/CELL|0));g[2*r+1][2*c+1]=ch};
  bullets.forEach(b=>put(b.x,b.y,"B"));put(P.x,P.y,"A");put(E.x,E.y,"E");
  return "战场图(#墙 A玩家=你的对手 E你自己 B子弹)：\n"+g.map(r=>r.join("")).join("\n");
}
/* ==================== 流式指令通道 ====================
 * AI 始终处于"关闭思考的输出状态"：stream + thinking disabled，
 * 增量 token 一到就解析执行，新指令立即打断当前动作。
 * 指令语法（混合输入，AI 自由选择）：
 *   {"cmd":"turn","deg":45}      相对转向（度，+顺时针）
 *   {"cmd":"face","deg":90}      绝对朝向（度，0=右 90=下）
 *   {"cmd":"fwd","ms":800}       前进
 *   {"cmd":"back","ms":400}      后退
 *   {"cmd":"fire"}               开炮
 *   {"cmd":"algo","name":"dodge_bullets"}  调用算法（内置/自写同层级）
 *   {"cmd":"stop"}               停止当前动作
 *   {"new_algo":{"name":"x","desc":"..","hint":"何时用"}}  声明新算法（存档，供调用与复盘参考）
 */
const CMD_SYS=`你是坦克的实时操控流。持续输出控制指令，每行一个 JSON（不要解释、不要数组分隔）：
{"cmd":"turn","deg":相对角度} {"cmd":"face","deg":绝对角度0右90下} {"cmd":"fwd","ms":毫秒} {"cmd":"back","ms":毫秒} {"cmd":"fire"} {"cmd":"algo","name":算法名} {"cmd":"stop"}
可用算法（algo）：${"\${ALGO_NAMES}"}
你可以编写/改写自己的算法（会在之后所有局生效）：
{"set_algo":{"name":"my_attack","desc":"我的打法","steps":[{"when":"bullet_threat","do":"dodge_bullets"},{"when":"enemy_far:300","do":"chase_and_fire"},{"when":"always","do":"ricochet_fire"}]}}
when 条件：always/bullet_threat/enemy_near:像素/enemy_far:像素/aligned/random:概率
do 原语：任一算法名/turn:度/face:度/fwd/back/fire/fire_ricochet（含墙体反弹的弹道计算开火）/stop
不需要时可删除自写算法：{"del_algo":"my_attack"}
局面会周期性推送给你。子弹会反弹可炸死自己——威胁逼近优先 dodge_bullets。
历史教训：\n{L}`

let streamAbort=null, streamOn=true, cmdBuf="", lastFeed=0;
// 测试模式：注入测试数据时开启——复盘挂起、战报静默、流式指令暂停，避免污染记忆
let testMode=false;
let dodgeOnly=false; // 仅躲避模式：AI 决策流关闭，只跑 dodge_bullets
window.__test={on:()=>{testMode=true;paused=true},off:()=>{testMode=false;paused=false}};
window.__dodgeOnly={on:()=>{dodgeOnly=true;streamOn=false;E.curAlgo="dodge_bullets";brainEl.textContent="仅躲避模式（AI 决策已关）"},
  off:()=>{dodgeOnly=false;streamOn=true;E.curAlgo=null;brainEl.textContent="指令流恢复"}};
function applyCmd(o){
  if(!o)return;
  if(!o.cmd&&(o.set_algo||o.new_algo||o.del_algo)){
    // AI 输出裸元操作对象（无 cmd 包装）——归一化
    o={cmd:"meta",...(o.set_algo?{set_algo:o.set_algo}:{}),...(o.new_algo?{new_algo:o.new_algo}:{}),...(o.del_algo?{del_algo:o.del_algo}:{})};
  }
  if(!o.cmd)return;
  // 元操作（算法编写/删除）任何时候都放行——暂停时 AI 也能进化算法
  if(o.new_algo||o.set_algo||o.del_algo){
    if(testMode)return; // 仅测试模式全拦截（防污染）
    // fallthrough 到元操作分支
  }else if(paused||testMode)return; // 游戏控制指令：暂停/测试模式拦截
  if(o.new_algo){
    const a=o.new_algo;
    if(a&&a.name){
      if(!ALGOS[a.name]){
        ALGOS[a.name]={desc:a.desc||"",hint:a.hint||"",fn:(ALGOS.roam&&ALGOS.roam.fn)||((t,dt)=>{}),builtin:false,composed:[]};
        brainEl.textContent=`AI 声明新算法：${a.name}（${a.desc||""}）`;
      }else{
        ALGOS[a.name].desc=a.desc||ALGOS[a.name].desc;
        ALGOS[a.name].hint=a.hint||ALGOS[a.name].hint;
        brainEl.textContent=`AI 更新算法：${a.name}`;
      }
    }
    return;
  }
  // 重写已有算法：组合原语序列 + 条件分支（AI 可迭代改进自己的算法）
  if(o.set_algo){
    const a=o.set_algo;
    const target=ALGOS[a&&a.name];
    if(target&&target.builtin){brainEl.textContent=`${a.name} 是内置算法，不可覆盖`;return}
    if(a&&a.name&&Array.isArray(a.steps)){
      const steps=a.steps.map(st=>({
        when:st.when||"always",            // always | bullet_threat | enemy_near:<px> | enemy_far:<px> | aligned | random:<p>
        do:st.do||"roam",                  // 原语：任一算法名 / turn:<deg> / face:<deg> / fwd / back / fire / fire_ricochet / stop
      }));
      ALGOS[a.name]={desc:a.desc||"",hint:a.hint||"",builtin:false,composed:steps,
        fn:(t,dt,ctx)=>{
          for(const st of steps){
            if(!condMatch(st.when,t,ctx))continue;
            execPrim(st.do,t,dt,ctx);
            return true;
          }
          return false;
        }};
      brainEl.textContent=`AI ${ALGOS[a.name]&&"重构"||"写入"}算法 ${a.name}（${steps.length} 步）`;
      saveAlgos();
    }
    return;
  }
  if(o.del_algo&&ALGOS[o.del_algo]&&!ALGOS[o.del_algo].builtin){
    delete ALGOS[o.del_algo];
    if(E.curAlgo===o.del_algo)E.curAlgo=null;
    brainEl.textContent=`AI 删除算法 ${o.del_algo}`;
    saveAlgos();
    return;
  }
  E.curAlgo=null;E.turnTarget=null; // 任何新指令立即打断当前动作/算法/转向
  switch(o.cmd){
    case"turn":E.turnTarget=(E.a+(o.deg||0)*Math.PI/180);break;   // 意图：每帧以 ROT 消化
    case"face":E.turnTarget=(o.deg||0)*Math.PI/180;break;
    case"fwd":E.act={type:"drive",dir:1,until:gT+(o.ms||600)/1000};break;
    case"back":E.act={type:"drive",dir:-1,until:gT+(o.ms||400)/1000};break;
    case"fire":fire(E);break;
    case"algo":{
      const a=ALGOS[o.name];
      if(a){E.curAlgo=o.name;brainEl.textContent=`算法：${o.name}（${a.desc||""}）`}
      break;
    }
    case"stop":E.act=null;break;
  }
}
function feedLine(line){
  line=line.trim(); if(!line)return;
  const i=line.indexOf("{"), j=line.lastIndexOf("}");
  if(i<0)return;
  try{applyCmd(JSON.parse(line.slice(i,j+1)))}catch(e){}
}
async function streamLoop(){
  while(streamOn){
    if(testMode){await sleep(200);continue}
    if(paused){await sleep(150);continue} // 暂停：流挂起（不请求不思考）
    if(!cfg.key||interT>0||!P.alive||!E.alive){await sleep(500);continue}
    brainEl.textContent=streamAbort?"":"流式指令中…";
    try{
      const sys=CMD_SYS.replace("${ALGO_NAMES}",Object.entries(ALGOS).map(([n,a])=>`${n}=${a.desc}${a.hint?"("+a.hint+")":""}`).join(", ")).replace("{L}",lessons.length?lessons.map(l=>"- "+l).join("\n"):"（暂无）");
      const body={model:cfg.model,max_tokens:4096,stream:true,thinking:{type:"disabled"},system:sys,
        messages:[{role:"user",content:stateText()+"\n"+asciiMap()+"\n开始持续输出指令："}]};
      const r=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":cfg.key},body:JSON.stringify(body)});
      if(!r.ok||!r.body)throw new Error("HTTP "+r.status);
      const rd=r.body.getReader(), dec=new TextDecoder();
      cmdBuf=""; lastFeed=gT;
      while(true){
        if(paused||testMode)break; // 中途暂停：丢弃剩余流
        const{done,value}=await rd.read();
        if(done)break;
        const chunk=dec.decode(value,{stream:true});
        for(const ln of chunk.split("\n")){
          if(!ln.startsWith("data:"))continue;
          const d=ln.slice(5).trim();
          if(!d||d==="[DONE]")continue;
          try{
            const ev=JSON.parse(d);
            if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
              cmdBuf+=ev.delta.text;
              lastFeed=gT;
              // 按行解析执行（增量到达即执行）
              const k=cmdBuf.lastIndexOf("\n");
              if(k>=0){feedLine(cmdBuf.slice(0,k));cmdBuf=cmdBuf.slice(k+1)}
              else if(/[}]\s*$/.test(cmdBuf)&&/^[^{}]*\{[^{}]*\}[^{}]*$/.test(cmdBuf)){feedLine(cmdBuf);cmdBuf=""} // 单行完整 JSON
            }
          }catch(e){}
        }
      }
    }catch(e){brainEl.textContent="指令流断开，重连…"}
    await sleep(300); // 断线立即重连，保持常输出态
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
// 周期推送新局面（打断当前流，带最新战场信息重启）
setInterval(()=>{
  if(!cfg.key||streamAbort)return;
  if(gT-lastFeed>6){try{streamAbort&&streamAbort.abort()}catch(e){}; restartStream()}
},3000);
let streamRestarting=false;
async function restartStream(){
  if(streamRestarting)return;streamRestarting=true;
  // 触发重连：置空当前 reader 循环（简单做法：靠 streamLoop 的 while 自愈）
  streamRestarting=false;
}

function saveAlgos(){ // AI 自写算法持久化（步骤 JSON，非函数体）
  const out={};
  for(const[n,a]of Object.entries(ALGOS)){
    if(a.builtin)continue;
    out[n]={desc:a.desc,hint:a.hint,composed:a.composed||[]};
  }
  try{localStorage.setItem("aitank_algos",JSON.stringify(out))}catch(e){}

function loadMem(){try{

  if(["arrowdown","s"].includes(k)){keys.back=true;e.preventDefault()}
  if(["arrowleft","a"].includes(k)){keys.ccw=true;e.preventDefault()}
  if(["arrowright","d"].includes(k)){keys.cw=true;e.preventDefault()}
  if(k===" "||k==="j"){fire(P);e.preventDefault()}
  if(k==="p"){togglePause()}
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","w"].includes(k))keys.fwd=false;
  if(["arrowdown","s"].includes(k))keys.back=false;
  if(["arrowleft","a"].includes(k))keys.ccw=false;
  if(["arrowright","d"].includes(k))keys.cw=false;
});
document.querySelectorAll(".dp").forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;el.classList.add("on")};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove("on")};
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointerleave",off);
});
function togglePause(){paused=!paused;pauseBtn.textContent=paused?"▶ 继续":"⏸ 暂停";
  if(paused){brainEl.textContent="已暂停（AI 指令流挂起）";cmdBuf=""}
  else brainEl.textContent="恢复，指令流重启…"}

/* ==================== 设置 UI ==================== */
const dlg=document.getElementById("dlg"),cfgKey=document.getElementById("cfgKey"),cfgModel=document.getElementById("cfgModel"),cfgEndpoint=document.getElementById("cfgEndpoint"),memBox=document.getElementById("memBox");
let pendingReflect=false;
function fillDlg(){cfgKey.value=cfg.key;cfgModel.value=cfg.model;cfgEndpoint.value=cfg.endpoint;
  memBox.innerHTML=lessons.length?lessons.map(l=>"• "+l).join("<br>"):"（空）"}
function showSettings(note){
  fillDlg();
  if(note){const h=dlg.querySelector("h3");h.textContent="AI 设置"+(note?" — "+note:"")}
  dlg.style.display="flex";
}
document.getElementById("cfgBtn").addEventListener("click",()=>{fillDlg();dlg.style.display="flex"});
document.getElementById("save").addEventListener("click",()=>{
  cfg.key=cfgKey.value.trim();cfg.model=cfgModel.value.trim()||"deepseek-flash";cfg.endpoint=cfgEndpoint.value.trim()||"https://api.deepseek.com/anthropic/v1/messages";
  saveMem();dlg.style.display="none";
  statusEl.classList.remove("err");
  if(pendingReflect){statusEl.textContent="配置完成，自动复盘开局…";doReflect()}
  else statusEl.textContent="AI 配置已保存"
});
document.getElementById("memClr").addEventListener("click",()=>{lessons=[];saveMem();fillDlg()});

/* ==================== 渲染 ==================== */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const brainEl=document.getElementById("brain"),statusEl=document.getElementById("status"),pauseBtn=document.getElementById("pauseBtn");
document.getElementById("fireBtn").addEventListener("pointerdown",e=>{e.preventDefault();fire(P)});
pauseBtn.addEventListener("click",togglePause);
const dodgeOnlyBtn=document.getElementById("dodgeOnlyBtn");
dodgeOnlyBtn.addEventListener("click",()=>{dodgeOnly?window.__dodgeOnly.off():window.__dodgeOnly.on();dodgeOnlyBtn.textContent=dodgeOnly?"🛡 仅躲避中(点击恢复AI)":"🛡 仅躲避测试";dodgeOnlyBtn.style.background=dodgeOnly?"#3a5a3a":""});
const testBtn=document.getElementById("testBtn");
testBtn.addEventListener("click",()=>{if(testMode)window.__test.off();else window.__test.on();syncTestBtn()});
function syncTestBtn(){testBtn.style.display="";testBtn.textContent=testMode?"🧪 测试中(点击结束)":"🧪 测试模式";testBtn.style.background=testMode?"#5a3a3a":"";
  if(testMode){statusEl.textContent="测试模式：复盘与记忆已挂起（不影响真实战报）";statusEl.classList.remove("err")}}
function hud(){
  sp.textContent=P.score;sa.textContent=E.score;sr.textContent=round;
  chipP.classList.toggle("hit",!P.alive);chipA.classList.toggle("hit",!E.alive);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawTank(t,color){
  if(!t.alive)return;
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);
  ctx.fillStyle=color+"33";rr(-34,-28,68,56,14);ctx.fill();
  const g=ctx.createLinearGradient(-24,0,24,0);g.addColorStop(0,color);g.addColorStop(1,color+"b0");
  ctx.fillStyle=g;rr(-24,-19,48,38,10);ctx.fill();
  ctx.strokeStyle="#fffc";ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(36,0);ctx.stroke();
  ctx.restore();
  if(t===P){ctx.strokeStyle="#fff8";ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,38,0,7);ctx.stroke()}
}
function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#0f1120";rr(0,0,cv.width,cv.height,22);ctx.fill();
  const sc=Math.min(cv.width/FW,(cv.height-40)/FH);
  ctx.save();ctx.translate((cv.width-FW*sc)/2,20+(cv.height-40-FH*sc)/2);ctx.scale(sc,sc);
  ctx.fillStyle="#12141f";rr(0,0,FW,FH,18);ctx.fill();
  ctx.strokeStyle="#ffffff10";ctx.lineWidth=1;
  for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,FH);ctx.stroke()}
  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(FW,r*CELL);ctx.stroke()}
  for(const w of walls){ctx.fillStyle="#3b4260";rr(w.x,w.y,w.w,w.h,6);ctx.fill();
    ctx.fillStyle="#8890c818";rr(w.x,w.y,w.w,w.h,6);ctx.fill()}
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2.2);ctx.fillStyle="#ffb060";
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  for(const b of bullets){
    const c=b.own==="P"?"#7a88ff":"#ff8878";
    ctx.fillStyle=c+"30";ctx.beginPath();ctx.arc(b.x,b.y,16,0,7);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,4.5,0,7);ctx.fill();
  }
  drawTank(P,"#5b6fc0");drawTank(E,"#c05a50");
  if(interT>0){
    ctx.fillStyle="#000a";rr(0,0,FW,FH,18);ctx.fill();
    ctx.fillStyle="#dde0ee";ctx.font="700 44px system-ui";ctx.textAlign="center";
    ctx.fillText(P.alive?"击毁对方！":"你被击毁",FW/2,FH/2-8);
    ctx.font="14px system-ui";ctx.fillStyle="#8890b0";
    ctx.fillText("复盘后自动开始下一回合",FW/2,FH/2+28);
  }
  ctx.restore();
}

/* ==================== 主循环 ==================== */
let last=performance.now(),dirTimer=0;
function loop(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  if(!paused){
    if(interT>0){
      interT-=dt;
      if(interT<=0&&!reviewPending){round++;newRound();hud()}
      updateBulletsStandalone(dt); // 结算期间子弹照常消亡并归还弹匣
    }else{
      gT+=dt;
      P.cd=Math.max(0,P.cd-dt);E.cd=Math.max(0,E.cd-dt);
      if(!testMode&&(gT-lastSnap>2)){lastSnap=gT;
        roundLog.push(`[${gT.toFixed(0)}s] 态势 我(${E.x/CELL|0},${E.y/CELL|0},${(E.a*180/Math.PI).toFixed(0)}°,弹${MAG-E.live}) 敌(${P.x/CELL|0},${P.y/CELL|0},${(P.a*180/Math.PI).toFixed(0)}°) 距${Math.hypot(P.x-E.x,P.y-E.y)/CELL|0}格 飞弹${bullets.length}${E.curAlgo?" 用"+E.curAlgo:""}`)}

      if(keys.cw)P.a+=ROT*dt;
      if(keys.ccw)P.a-=ROT*dt;
      if(keys.fwd||keys.back){
        const d=keys.fwd?1:-0.65;   // 后退 = 反方向（原版：倒车慢）
        const nx=P.x+Math.cos(P.a)*TSPD*d*dt,ny=P.y+Math.sin(P.a)*TSPD*d*dt;
        if(!blk(nx,P.y))P.x=nx;
        if(!blk(P.x,ny))P.y=ny;
      }
      aiLocal(dt);
      // 子弹
      for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];b.life-=dt;
        if(b.life<=0){boom(b.x,b.y);bullets.splice(i,1);releaseAmmo(b);continue}
        const sub=3,sdt=dt/sub;
        for(let s=0;s<sub;s++){
          const nx=b.x+b.vx*sdt;
          if(bblk(nx,b.y))b.vx=-b.vx;else b.x=nx;
          const ny=b.y+b.vy*sdt;
          if(bblk(b.x,ny))b.vy=-b.vy;else b.y=ny;
        }
        let hit=false;
        for(const t of[P,E]){
          if(!t.alive)continue;
          if(Math.hypot(t.x-b.x,t.y-b.y)<TR){
            boom(t.x,t.y);t.alive=false;bullets.splice(i,1);releaseAmmo(b);hit=true;
            roundOver(t);break;
          }
        }
        if(hit)continue;
      }
      for(let i=parts.length-1;i>=0;i--){
        const p=parts[i];p.life-=dt;
        if(p.life<=0){parts.splice(i,1);continue}
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;
      }
      // 流式指令通道自运行（streamLoop），此处无需轮询
      hud();
    }
  }
  render();
  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
loadMem();
newRound();
hud();
streamLoop(); // AI 常输出态：流式指令 + 断线自愈重连
if(!cfg.key){statusEl.textContent="提示：尚未配置 AI（DeepSeek）。本游戏需要 AI 参与复盘与进化——点「⚙ AI 设置」填入 API Key。";statusEl.classList.add("err")}
requestAnimationFrame(loop);
</script>
